<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details - Aarambh Luminous Learning</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><img src="logo.jpg" alt="logo"></a>

                <p>AARAMBH <br>
                    Luminous Learning</p>
            </div>

            <ul class="nav-links">
                <li><a href="index.html#index">Home</a></li>
                <li><a href="index.html#plans">Course-plans</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>

            <button class="menu-btn" type="button" aria-label="Open navigation menu">
                <i class="fa fa-bars"></i>
            </button>
        </nav>
    </header>

    <main class="payment-page">

        <div class="payment-wrapper">

            <section class="order-summary">

                <h1>Order Summary</h1>

                <p class="order-summary-description">
                    Review the selected course information before entering your payment
                    details.
                </p>

                <div class="order-course-box">

                    <p class="order-label">Selected course</p>

                    <h2 id="selectedCourseName">Course Name</h2>

                    <div class="order-price-row">
                        <span>Total Amount</span>

                        <strong id="selectedCoursePrice">₹0</strong>
                    </div>

                </div>

                <a href="index.html#plans" class="back-link">
                    ← Back to Course-plans
                </a>

            </section>

            <section class="payment-form-section">

                <h2>Payment Details</h2>

                <p class="payment-form-description">
                    Enter your personal and card details to continue.
                </p>

                <form class="payment-form" id="paymentForm">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>

                        <input type="text" id="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input type="email" id="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input type="tel" id="phone" placeholder="Enter your phone number" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="cardName">Name on Card</label>

                        <input type="text" id="cardName" placeholder="Enter the name on your card" required>
                    </div>

                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>

                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="expiryDate">Expiry Date</label>

                            <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                        </div>

                        <div class="form-group">
                            <label for="cvv">CVV</label>

                            <input type="password" id="cvv" placeholder="123" maxlength="3" required>
                        </div>

                    </div>

                    <button type="submit" class="pay-button" id="payButton">
                        Pay Now
                    </button>

                    <p class="payment-message" id="paymentMessage"></p>

                </form>

            </section>

        </div>

    </main>

    <script>
        const urlParameters = new URLSearchParams(window.location.search);

        const courseName = urlParameters.get("course") || "Selected Course";
        const coursePrice = urlParameters.get("price") || "0";

        const selectedCourseName = document.getElementById("selectedCourseName");
        const selectedCoursePrice = document.getElementById("selectedCoursePrice");
        const payButton = document.getElementById("payButton");
        const paymentForm = document.getElementById("paymentForm");
        const paymentMessage = document.getElementById("paymentMessage");
        const cardNumber = document.getElementById("cardNumber");
        const expiryDate = document.getElementById("expiryDate");

        function formatPrice(price) {
            return "₹" + Number(price).toLocaleString("en-IN");
        }

        selectedCourseName.textContent = courseName;
        selectedCoursePrice.textContent = formatPrice(coursePrice);
        payButton.textContent = "Pay " + formatPrice(coursePrice);

        cardNumber.addEventListener("input", function () {
            let value = cardNumber.value.replace(/\D/g, "");

            value = value.substring(0, 16);

            cardNumber.value = value.replace(/(.{4})/g, "$1 ").trim();
        });

        expiryDate.addEventListener("input", function () {
            let value = expiryDate.value.replace(/\D/g, "");

            if (value.length >= 3) {
                value = value.substring(0, 2) + "/" + value.substring(2, 4);
            }

            expiryDate.value = value;
        });

        paymentForm.addEventListener("submit", function (event) {
            event.preventDefault();

            paymentMessage.textContent =
                "Payment request submitted successfully for " + courseName + ".";

            paymentForm.reset();
        });

        const menu = document.querySelector(".menu-btn");
        const nav = document.querySelector(".nav-links");

        menu.addEventListener("click", function () {
            nav.classList.toggle("active");
        });

        nav.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                nav.classList.remove("active");
            });
        });
    </script>

</body>

</html>
