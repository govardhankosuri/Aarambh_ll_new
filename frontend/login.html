<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aarambh Luminous Learning | Admin Login</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="login-container">


    <div class="login-box">

        <a
        href="index.html"
        class="home-nav-btn"
        aria-label="Go to home page"
        title="Home">
            &#8962;
        </a>


        <div class="logo-section">

            <h1>Aarambh</h1>

            <p>
                Luminous Learning
            </p>

        </div>



        <h2>
            Admin Login
        </h2>


        <p class="login-text">
            Login to access your admin dashboard
        </p>




        <form id="loginForm">



            <div class="input-group">

                <label>
                    Email Address
                </label>


                <input 
                type="email"
                id="email"
                placeholder="Enter admin email"
                required>


            </div>





            <div class="input-group">


                <label>
                    Password
                </label>


                <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>


            </div>





            <p id="errorMessage"></p>




            <button 
            type="submit"
            class="login-btn">

                Login

            </button>





            <a href="reset-password.html"
               class="reset-password">

                Reset Password


            </a>



        </form>



    </div>


</div>





<script src="login.js"></script>


</body>

</html>
